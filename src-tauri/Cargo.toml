[package]
name = "mike"
version = "0.13.0"
description = "Dictado por voz push-to-talk, local y gratuito"
authors = ["luisg"]
edition = "2021"

[lib]
name = "mike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx"] }
cpal = "0.18"
rubato = "0.16"
rdev = { version = "0.5", features = ["serialize"] }
enigo = "0.6"
arboard = "3"
keyring = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
hound = "3.5"
regex = "1"
reqwest = { version = "0.13", features = ["json", "multipart", "stream", "query", "form"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# Colocación del HUD sobre el monitor activo, z-order topmost y arrastre con
# el ratón (overlay.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # Para leer el nombre del proceso en primer plano (la lista de apps donde la
    # correccion al vuelo no actua).
    "Win32_System_Threading",
] }

# Deps optimizados tambien en dev: rubato/ort en debug son 20-30x mas lentos
# (causa directa de dictados de >25 s). El crate propio queda en opt-level 1
# para compilar rapido.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
